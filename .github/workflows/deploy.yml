name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Rebuild every 6 hours so new beINvolved events appear and past events drop off
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set the repository variable CUSTOM_DOMAIN (Settings > Secrets and variables > Actions > Variables)
      # to netimpactiu.org once the domain is connected. Until then the site builds for
      # https://net-impact-iu.github.io/website
      SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://net-impact-iu.github.io' }}
      BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || '/website' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - name: Fetch latest Instagram posts
        run: npm run fetch:instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      - name: Fetch upcoming events from beINvolved and the IU sustainability calendar
        run: npm run fetch:events
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
