name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so past events drop off (about 5 am Indiana time)
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set the repository variable CUSTOM_DOMAIN (Settings > Secrets and variables > Actions > Variables)
      # to netimpactiu.org once the domain is connected. Until then the site builds for
      # https://net-impact-iu.github.io/website
      SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://net-impact-iu.github.io' }}
      BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || '/website' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
